<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--ink:#f2f2f0;--muted:#9a9a96;--line:#2a2a2a;--accent:#f2f2f0}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 15% 10%,#1a1a1c 0%,var(--bg) 45%,#000000 100%);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:12vh 24px 48px}
h1{font-size:clamp(3.5rem,14vw,6.5rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.intro{margin-top:16px;color:var(--muted);font-weight:300;font-size:1.15rem;max-width:36ch}
section{margin-top:56px}
h2{font-size:1.35rem;font-weight:500}
.about{color:var(--muted);font-weight:300;margin-top:2px}
ul{list-style:none;padding:0;margin-top:16px;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a.link{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 4px;color:inherit;text-decoration:none;transition:padding .2s,color .2s}
a.link:hover{padding-left:12px;color:var(--accent)}
a.link:focus-visible,footer a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.platform{font-weight:500;display:flex;align-items:center;gap:12px}
.icon{width:24px;height:24px;flex:none}
.handle{color:var(--muted);font-weight:300;font-size:.95rem;overflow-wrap:anywhere;text-align:right}
footer{border-top:1px solid var(--line);text-align:center;padding:24px;color:var(--muted);font-size:.9rem;font-weight:300}
footer a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:2px solid var(--accent)}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg span{position:absolute;left:var(--l);bottom:-12vh;width:var(--s);height:var(--s);animation:rise var(--t) linear var(--d) infinite}
.bg .a{background:rgba(255,255,255,.06)}
.bg .b{background:rgba(255,255,255,.035)}
.bg .o{border:2px solid rgba(255,255,255,.16)}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(28px,-65vh) rotate(90deg)}90%{opacity:1}100%{transform:translate(-20px,-125vh) rotate(180deg);opacity:0}}
main,footer{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}.bg span{animation:none;bottom:var(--p)}}
</style>
</head>
